name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The oldest Node `engines` allows, and the one the Docker image ships.
    strategy:
      matrix:
        node: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Runtime dependencies only: an advisory in a dev tool is Dependabot's to
      # raise, but one in what the server ships with should stop the merge.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test, with coverage
        run: npm run coverage

      # Catches the things only a real build shows: the server bundle
      # resolving @room/shared, and the client compiling for production.
      - name: Build
        run: npm run build

      - name: Smoke-test the production server
        run: |
          NODE_ENV=production PORT=8787 node server/dist/index.js &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8787/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8787/api/health | grep -q '"ok":true'
          # The built client has to be served by that same process.
          curl -sf http://127.0.0.1:8787/ | grep -q '<div id="root">'

  e2e:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds, then drives the production server in a real browser.
      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
